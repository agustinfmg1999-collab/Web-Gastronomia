<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mozo — El Patio Tapas Bar</title>
  <link rel="stylesheet" href="/src/styles/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; }
    .login-box { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-card { background: #1e1e2e; border-radius: 16px; padding: 32px; max-width: 360px; width: 100%; text-align: center; }
    .login-card h2 { font-size: 1.3rem; margin-bottom: 16px; }
    .login-card input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a3e; color: #fff; font-size: 1rem; margin-bottom: 10px; }
    .login-card button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; }
    .header { background: #1e1e2e; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; }
    .header h1 { font-size: 1.2rem; color: #22c55e; }
    .tabs-bar { display: flex; gap: 0; background: #1e1e2e; border-bottom: 1px solid #27272a; }
    .tab-btn { flex: 1; padding: 12px; text-align: center; background: transparent; color: #888; border: none; font-size: 0.9rem; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #22c55e; border-bottom-color: #22c55e; font-weight: 700; }
    .section { display: none; padding: 16px; }
    .section.active { display: block; }
    .card { background: #1e1e2e; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid #333; }
    .card.active { border-left-color: #f59e0b; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .item-row { padding: 4px 0; font-size: 0.9rem; color: #ccc; }
    .item-qty { color: #f97316; font-weight: 700; }
    .btn-call { background: #22c55e; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-call:disabled { background: #333; color: #666; }
    .alert-card { background: #1e1e2e; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; border-left: 4px solid #f59e0b; display: flex; justify-content: space-between; align-items: center; }
    .empty { text-align: center; color: #888; padding: 40px 20px; }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-box">
    <div class="login-card">
      <div style="font-size:2.5rem; margin-bottom:12px;">🍽️</div>
      <h2>Mozo</h2>
      <input id="loginUsuario" type="text" placeholder="Usuario" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()" style="background:#22c55e; color:#fff;">Ingresar</button>
      <p id="loginError" style="color:#ef4444; font-size:0.85rem; margin-top:10px; display:none;">Credenciales incorrectas</p>
    </div>
  </div>

  <div id="appMain" style="display:none;">
    <div class="header">
      <h1>🍽️ <span id="userName">Mozo</span></h1>
      <button onclick="doLogout()" style="background:transparent; color:#888; border:1px solid #333; padding:6px 14px; border-radius:6px; cursor:pointer;">Salir</button>
    </div>

    <div class="tabs-bar">
      <button class="tab-btn active" onclick="showSection('pedidos', this)">📋 Pedidos</button>
      <button class="tab-btn" onclick="showSection('llamadas', this)">🔔 Llamadas</button>
    </div>

    <div id="secPedidos" class="section active">
      <div id="pedidosGrid"></div>
      <div id="pedidosEmpty" class="empty">No hay pedidos activos</div>
    </div>

    <div id="secLlamadas" class="section">
      <div id="llamadasGrid"></div>
      <div id="llamadasEmpty" class="empty">No hay llamadas pendientes</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let authToken = null;
    let currentUser = null;

    async function doLogin() {
      const usuario = document.getElementById('loginUsuario').value.trim();
      const pw = document.getElementById('loginPassword').value;
      if (!usuario || !pw) return;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password: pw })
        });
        if (res.ok) {
          const data = await res.json();
          if (!['admin', 'mozo', 'cajero'].includes(data.rol)) {
            document.getElementById('loginError').textContent = 'Este usuario no tiene acceso de mozo';
            document.getElementById('loginError').style.display = 'block';
            return;
          }
          authToken = data.token;
          currentUser = data;
          document.getElementById('loginOverlay').style.display = 'none';
          document.getElementById('appMain').style.display = 'block';
          document.getElementById('userName').textContent = data.nombre || data.usuario;
          loadData();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      } catch(e) { document.getElementById('loginError').style.display = 'block'; }
    }

    function doLogout() {
      fetch('/api/auth/logout', { method: 'POST', headers: { 'x-auth-token': authToken } }).catch(() => {});
      authToken = null; currentUser = null;
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appMain').style.display = 'none';
    }

    function showSection(name, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('sec' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
      btn.classList.add('active');
    }

    const socket = io();
    socket.on('nuevo_pedido', () => loadData());
    socket.on('pedido_actualizado', () => loadData());
    socket.on('nueva_llamada_mozo', () => loadData());
    socket.on('llamada_atendida', () => loadData());

    async function loadData() {
      try {
        const [resP, resL] = await Promise.all([
          fetch('/api/pedidos', { headers: { 'x-auth-token': authToken } }),
          fetch('/api/mozo', { headers: { 'x-auth-token': authToken } })
        ]);
        if (resP.status === 401 || resL.status === 401) { doLogout(); return; }
        const pedidos = await resP.json();
        const llamadas = await resL.json();

        const activos = pedidos.filter(p => !p.pagado && p.estado !== 'entregado')
          .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
        const grid = document.getElementById('pedidosGrid');
        const empty = document.getElementById('pedidosEmpty');

        if (!activos.length) { grid.innerHTML = ''; empty.style.display = 'block'; }
        else {
          empty.style.display = 'none';
          grid.innerHTML = activos.map(p => {
            const elapsed = Math.floor((Date.now() - new Date(p.fecha)) / 60000);
            const statusLabel = { pendiente: '🟡 Pendiente', en_preparacion: '🔵 En preparación' };
            const items = (p.items || []).map(i => `<div class="item-row"><span class="item-qty">x${i.cantidad}</span> ${i.nombre}${i.notas ? ' 📝' : ''}</div>`).join('');
            return `
              <div class="card active">
                <div class="card-header">
                  <strong>${p.mesa}</strong>
                  <span style="color:#888; font-size:0.8rem;">⏱ ${elapsed}min — ${statusLabel[p.estado] || p.estado}</span>
                </div>
                ${items}
                ${p.tiempoEstimado ? `<div style="color:#f97316; font-size:0.8rem; margin-top:6px;">~${p.tiempoEstimado} min estimado</div>` : ''}
              </div>`;
          }).join('');
        }

        const pendLlamadas = llamadas.filter(l => !l.atendido);
        const lGrid = document.getElementById('llamadasGrid');
        const lEmpty = document.getElementById('llamadasEmpty');
        if (!pendLlamadas.length) { lGrid.innerHTML = ''; lEmpty.style.display = 'block'; }
        else {
          lEmpty.style.display = 'none';
          lGrid.innerHTML = pendLlamadas.map(l => {
            const elapsed = Math.floor((Date.now() - new Date(l.fecha)) / 60000);
            return `
              <div class="alert-card">
                <div>
                  <strong>${l.mesa}</strong> — ${l.tipo}
                  <span style="color:#888; font-size:0.8rem; margin-left:8px;">⏱ ${elapsed}min</span>
                </div>
                <button onclick="attendCall('${l.id}')" class="btn-call">✓ Atender</button>
              </div>`;
          }).join('');
        }
      } catch(e) { console.error('Error:', e); }
    }

    async function attendCall(id) {
      await fetch(`/api/mozo/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json', 'x-auth-token': authToken }
      });
      loadData();
    }

    setInterval(loadData, 10000);
  </script>
</body>
</html>
